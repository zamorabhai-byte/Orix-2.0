<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="ORIX 2.0 — a futuristic AI assistant running inside a premium black and electric-blue interface.">
    <title>ORIX 2.0</title>
    <!-- Fonts: Space Grotesk for headings/logo, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           DESIGN TOKENS — BLACK + ELECTRIC BLUE
           ============================================================ */
        :root {
            --bg: #050505;
            --bg-soft: #0A0A0A;
            --surface: #0F1115;
            --surface-2: #12151C;
            --card: #0F1115;
            --border: #123A5A;
            --border-soft: rgba(18, 58, 90, 0.55);
            --blue: #008CFF;
            --blue-bright: #00B7FF;
            --blue-dim: rgba(0, 140, 255, 0.12);
            --text: #F5F7FA;
            --text-2: #8A94A6;
            --text-muted: #566170;
            --glow: rgba(0, 140, 255, 0.35);
            --glow-strong: rgba(0, 183, 255, 0.55);
            --radius-sm: 10px;
            --radius: 14px;
            --radius-lg: 20px;
            --radius-xl: 26px;
            --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
            --dur: 220ms;
            --header-h: 60px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
        }

        /* Reset & base */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            overscroll-behavior: none;
        }
        /* Subtle ambient blue glow — fixed, GPU-friendly */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(900px 500px at 50% -10%, rgba(0, 140, 255, 0.10), transparent 70%),
                radial-gradient(700px 400px at 100% 110%, rgba(0, 140, 255, 0.05), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        #root { height: 100%; position: relative; z-index: 1; }

        button, input, textarea, select { font: inherit; color: inherit; }
        button { cursor: pointer; border: none; background: none; padding: 0; }
        button:disabled { cursor: not-allowed; }
        a { color: var(--blue-bright); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Visible focus rings for accessibility */
        :focus-visible {
            outline: 2px solid var(--blue-bright);
            outline-offset: 2px;
            border-radius: 6px;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(18, 58, 90, 0.7); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 140, 255, 0.45); }
        * { scrollbar-width: thin; scrollbar-color: rgba(18, 58, 90, 0.7) transparent; }

        /* ============================================================
           KEYFRAMES
           ============================================================ */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes orb-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--glow), 0 0 70px rgba(0,140,255,0.25), inset 0 0 24px rgba(0,183,255,0.5); }
            50% { transform: scale(1.045); box-shadow: 0 0 44px var(--glow-strong), 0 0 100px rgba(0,140,255,0.32), inset 0 0 32px rgba(0,183,255,0.65); }
        }
        @keyframes orb-spin { to { transform: rotate(360deg); } }
        @keyframes orb-spin-rev { to { transform: rotate(-360deg); } }
        @keyframes ring-pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        @keyframes dot-bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-5px); opacity: 1; }
        }
        @keyframes wave-bar {
            0%, 100% { transform: scaleY(0.35); }
            50% { transform: scaleY(1); }
        }
        @keyframes splash-out {
            to { opacity: 0; visibility: hidden; }
        }
        @keyframes float-particle {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-120px) translateX(20px); opacity: 0; }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slide-up {
            from { transform: translateY(14px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes banner-in {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============================================================
           APP SHELL
           ============================================================ */
        .app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden;
        }

        /* ---------- HEADER ---------- */
        .header {
            position: sticky;
            top: 0;
            z-index: 30;
            display: grid;
            grid-template-columns: 48px 1fr 48px;
            align-items: center;
            gap: 8px;
            height: calc(var(--header-h) + var(--safe-top));
            padding: var(--safe-top) 10px 0;
            background: rgba(5, 5, 5, 0.86);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-soft);
            flex-shrink: 0;
        }
        .header__side { display: flex; align-items: center; gap: 4px; }
        .header__side--right { justify-content: flex-end; }
        .header__center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-width: 0;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }
        .brand__mark {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 8px var(--glow));
        }
        .brand__name {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.06em;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand__name em {
            font-style: normal;
            color: var(--blue-bright);
        }

        /* ---------- ICON BUTTON ---------- */
        .icon-btn {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: var(--text-2);
            transition: background var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
            flex-shrink: 0;
        }
        .icon-btn:hover { background: rgba(0, 140, 255, 0.08); color: var(--blue-bright); }
        .icon-btn:active { transform: scale(0.94); }
        .icon-btn--active {
            background: var(--blue-dim);
            color: var(--blue-bright);
            box-shadow: 0 0 16px -4px var(--glow);
        }
        .icon-btn[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }

        /* ---------- BANNER ---------- */
        .banner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 16px;
            background: rgba(0, 140, 255, 0.07);
            border-bottom: 1px solid var(--border-soft);
            color: var(--blue-bright);
            font-size: 13px;
            font-weight: 500;
            animation: banner-in 260ms var(--ease);
        }
        .banner svg { flex-shrink: 0; }

        /* ---------- SCRIM / SIDEBAR ---------- */
        .scrim {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 55;
            animation: fade-in 200ms var(--ease);
            border: none;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: min(330px, 88vw);
            background: var(--bg-soft);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 260ms var(--ease);
            z-index: 60;
            will-change: transform;
            box-shadow: 12px 0 40px -20px rgba(0, 0, 0, 0.9);
        }
        .sidebar--open { transform: translateX(0); }
        .sidebar__top {
            padding: calc(16px + var(--safe-top)) 16px 14px;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .sidebar__new { padding: 12px 14px; }
        .sidebar__list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .sidebar__section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            font-weight: 600;
            padding: 12px 10px 6px;
        }
        .sidebar__bottom {
            border-top: 1px solid var(--border-soft);
            padding: 8px 10px calc(10px + var(--safe-bottom));
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sidebar__empty {
            padding: 28px 14px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ---------- NAV ROW ---------- */
        .nav-row {
            display: flex;
            align-items: center;
            gap: 11px;
            width: 100%;
            padding: 11px 12px;
            border-radius: var(--radius-sm);
            color: var(--text-2);
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
        }
        .nav-row:hover { background: rgba(0, 140, 255, 0.07); color: var(--text); }
        .nav-row svg { flex-shrink: 0; }
        .nav-row--accent {
            background: var(--blue-dim);
            color: var(--blue-bright);
            border: 1px solid rgba(0, 140, 255, 0.28);
            font-weight: 600;
        }
        .nav-row--accent:hover { background: rgba(0, 140, 255, 0.18); color: var(--blue-bright); }

        /* ---------- CONVERSATION ITEM ---------- */
        .conv-item {
            display: flex;
            align-items: stretch;
            gap: 2px;
            border-radius: var(--radius-sm);
            position: relative;
            transition: background var(--dur) var(--ease);
        }
        .conv-item:hover { background: rgba(255, 255, 255, 0.03); }
        .conv-item--active {
            background: rgba(0, 140, 255, 0.09);
            box-shadow: inset 2px 0 0 var(--blue);
        }
        .conv-item__main {
            flex: 1;
            min-width: 0;
            text-align: left;
            padding: 9px 4px 9px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .conv-item__title {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item--active .conv-item__title { color: var(--blue-bright); }
        .conv-item__meta {
            font-size: 11.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item__menu-btn {
            width: 34px;
            display: grid;
            place-items: center;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            opacity: 0;
            transition: opacity var(--dur) var(--ease), color var(--dur) var(--ease);
        }
        .conv-item:hover .conv-item__menu-btn,
        .conv-item__menu-btn:focus-visible,
        .conv-item--active .conv-item__menu-btn { opacity: 1; }
        .conv-item__menu-btn:hover { color: var(--blue-bright); }
        @media (hover: none) {
            .conv-item__menu-btn { opacity: 1; }
        }
        .menu-pop {
            position: absolute;
            right: 6px;
            top: calc(100% - 2px);
            z-index: 10;
            min-width: 150px;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-sm);
            padding: 5px;
            box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(0, 140, 255, 0.06);
            animation: slide-up 160ms var(--ease);
        }
        .menu-pop__item {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            padding: 9px 10px;
            border-radius: 8px;
            font-size: 13.5px;
            color: var(--text-2);
            text-align: left;
            transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
        }
        .menu-pop__item:hover { background: rgba(0, 140, 255, 0.09); color: var(--text); }
        .menu-pop__item--danger:hover { background: rgba(0, 140, 255, 0.14); color: var(--blue-bright); }

        /* ---------- BUTTONS ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            border: 1px solid transparent;
            transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
                        color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform 120ms var(--ease);
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.975); }
        .btn--primary {
            background: var(--blue);
            color: #00121F;
            border-color: var(--blue-bright);
            box-shadow: 0 0 20px -6px var(--glow);
        }
        .btn--primary:hover { background: var(--blue-bright); box-shadow: 0 0 26px -4px var(--glow-strong); }
        .btn--ghost {
            background: transparent;
            border-color: var(--border);
            color: var(--text-2);
        }
        .btn--ghost:hover { border-color: var(--blue); color: var(--blue-bright); background: rgba(0, 140, 255, 0.06); }
        .btn--danger {
            background: transparent;
            border-color: rgba(0, 140, 255, 0.4);
            color: var(--blue-bright);
        }
        .btn--danger:hover { background: rgba(0, 140, 255, 0.12); }
        .btn--block { width: 100%; }
        .btn[disabled] { opacity: 0.42; pointer-events: none; }

        /* ---------- CHAT AREA ---------- */
        .chat {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }
        .chat__inner {
            max-width: 880px;
            margin: 0 auto;
            padding: 22px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-height: 100%;
        }
        .chat__spacer { flex: 1; min-height: 4px; }

        /* ---------- MESSAGE ---------- */
        .msg {
            display: flex;
            gap: 10px;
            animation: msg-in 260ms var(--ease) both;
            max-width: 100%;
        }
        .msg--user { justify-content: flex-end; }
        .msg--assistant { justify-content: flex-start; }
        .msg__avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 3px;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 35% 30%, #7FD4FF, var(--blue) 50%, #00325C 100%);
            box-shadow: 0 0 12px -2px var(--glow);
        }
        .msg__avatar::after {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00121F;
            opacity: 0.55;
        }
        .msg__body { min-width: 0; max-width: min(78ch, 88%); display: flex; flex-direction: column; gap: 5px; }
        .msg--user .msg__body { align-items: flex-end; }
        .msg__bubble {
            padding: 11px 15px;
            border-radius: var(--radius);
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            overflow-wrap: anywhere;
            border: 1px solid var(--border-soft);
            background: var(--surface);
        }
        .msg--user .msg__bubble {
            background: #0B0F14;
            border-color: rgba(0, 140, 255, 0.42);
            border-bottom-right-radius: 5px;
            box-shadow: 0 0 0 1px rgba(0, 140, 255, 0.05), 0 8px 26px -16px var(--glow);
            color: var(--text);
        }
        .msg--assistant .msg__bubble {
            background: #0C1016;
            border-color: var(--border-soft);
            border-bottom-left-radius: 5px;
            color: var(--text);
        }
        .msg__bubble--error {
            border-color: rgba(0, 140, 255, 0.55);
            background: rgba(0, 140, 255, 0.05);
            color: var(--text-2);
            font-size: 14px;
        }
        .msg__meta {
            font

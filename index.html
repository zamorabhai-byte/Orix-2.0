<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="ORIX 2.0 — a futuristic AI assistant running inside a premium black and electric-blue interface.">
<title>ORIX 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --bg-soft:#0A0A0A; --surface:#0F1115; --card:#0F1115;
  --border:#123A5A; --border-soft:rgba(18,58,90,.55);
  --blue:#008CFF; --blue-bright:#00B7FF; --blue-dim:rgba(0,140,255,.12);
  --text:#F5F7FA; --text-2:#8A94A6; --text-muted:#566170;
  --glow:rgba(0,140,255,.35); --glow-strong:rgba(0,183,255,.55);
  --radius-sm:10px; --radius:14px; --radius-lg:20px; --radius-xl:26px;
  --ease:cubic-bezier(.22,.61,.36,1); --dur:220ms; --header-h:60px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Space Grotesk','Inter',system-ui,sans-serif;
  --font-mono:'SF Mono','Fira Code','Cascadia Code',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 50% -10%,rgba(0,140,255,.10),transparent 70%),
             radial-gradient(700px 400px at 100% 110%,rgba(0,140,255,.05),transparent 70%)}
#root{height:100%;position:relative;z-index:1}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
button:disabled{cursor:not-allowed}
a{color:var(--blue-bright);text-decoration:none}
:focus-visible{outline:2px solid var(--blue-bright);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(18,58,90,.7);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,140,255,.45)}
*{scrollbar-width:thin;scrollbar-color:rgba(18,58,90,.7) transparent}

@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes msg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes orb-pulse{0%,100%{transform:scale(1);box-shadow:0 0 30px var(--glow),0 0 70px rgba(0,140,255,.25),inset 0 0 24px rgba(0,183,255,.5)}
  50%{transform:scale(1.045);box-shadow:0 0 44px var(--glow-strong),0 0 100px rgba(0,140,255,.32),inset 0 0 32px rgba(0,183,255,.65)}}
@keyframes orb-spin{to{transform:rotate(360deg)}}
@keyframes orb-spin-rev{to{transform:rotate(-360deg)}}
@keyframes ring-pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.6);opacity:0}}
@keyframes dot-bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
@keyframes wave-bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes splash-out{to{opacity:0;visibility:hidden}}
@keyframes float-particle{0%{transform:translateY(0) translateX(0);opacity:0}20%{opacity:.7}80%{opacity:.4}100%{transform:translateY(-120px) translateX(20px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide-up{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes banner-in{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes splash-load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.app{display:flex;flex-direction:column;height:100dvh;max-height:100dvh;overflow:hidden}

/* HEADER */
.header{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;
  height:calc(var(--header-h) + var(--safe-top));padding:var(--safe-top) 10px 0;
  background:rgba(5,5,5,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);flex-shrink:0}
.header__side{display:flex;align-items:center;gap:4px}
.header__side--right{justify-content:flex-end}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;min-width:0}
.brand__mark{width:26px;height:26px;flex-shrink:0;filter:drop-shadow(0 0 8px var(--glow))}
.brand__name{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.06em;
  color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand__name em{font-style:normal;color:var(--blue-bright)}
@media(max-width:420px){.brand__name{font-size:13.5px;letter-spacing:.04em}}

.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--text-2);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);flex-shrink:0}
.icon-btn:hover{background:rgba(0,140,255,.08);color:var(--blue-bright)}
.icon-btn:active{transform:scale(.94)}
.icon-btn--active{background:var(--blue-dim);color:var(--blue-bright);box-shadow:0 0 16px -4px var(--glow)}
.icon-btn[aria-disabled="true"]{opacity:.4;pointer-events:none}

.banner{display:flex;align-items:center;gap:10px;padding:9px 16px;background:rgba(0,140,255,.07);
  border-bottom:1px solid var(--border-soft);color:var(--blue-bright);font-size:13px;font-weight:500;
  animation:banner-in 260ms var(--ease)}
.banner svg{flex-shrink:0}
.banner__action{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--blue-bright);
  text-decoration:underline;text-underline-offset:2px;white-space:nowrap}

/* SIDEBAR */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);z-index:55;animation:fade-in 200ms var(--ease);border:none}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:min(330px,88vw);background:var(--bg-soft);
  border-right:1px solid var(--border-soft);display:flex;flex-direction:column;transform:translateX(-100%);
  transition:transform 260ms var(--ease);z-index:60;will-change:transform;box-shadow:12px 0 40px -20px rgba(0,0,0,.9)}
.sidebar--open{transform:translateX(0)}
.sidebar__top{padding:calc(16px + var(--safe-top)) 16px 14px;border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar__new{padding:12px 14px}
.sidebar__list{flex:1;overflow-y:auto;padding:6px 10px 10px;display:flex;flex-direction:column;gap:3px}
.sidebar__section-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);
  font-weight:600;padding:12px 10px 6px}
.sidebar__bottom{border-top:1px solid var(--border-soft);padding:8px 10px calc(10px + var(--safe-bottom));
  display:flex;flex-direction:column;gap:2px}
.sidebar__empty{padding:28px 14px;text-align:center;color:var(--text-muted);font-size:13px;line-height:1.6}

.nav-row{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:var(--radius-sm);
  color:var(--text-2);font-size:14px;font-weight:500;text-align:left;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.nav-row:hover{background:rgba(0,140,255,.07);color:var(--text)}
.nav-row svg{flex-shrink:0}
.nav-row--accent{background:var(--blue-dim);color:var(--blue-bright);border:1px solid rgba(0,140,255,.28);font-weight:600}
.nav-row--accent:hover{background:rgba(0,140,255,.18);color:var(--blue-bright)}

.conv-item{display:flex;align-items:stretch;gap:2px;border-radius:var(--radius-sm);position:relative;
  transition:background var(--dur) var(--ease)}
.conv-item:hover{background:rgba(255,255,255,.03)}
.conv-item--active{background:rgba(0,140,255,.09);box-shadow:inset 2px 0 0 var(--blue)}
.conv-item__main{flex:1;min-width:0;text-align:left;padding:9px 4px 9px 12px;display:flex;flex-direction:column;gap:2px}
.conv-item__title{font-size:13.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item--active .conv-item__title{color:var(--blue-bright)}
.conv-item__meta{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item__menu-btn{width:34px;display:grid;place-items:center;color:var(--text-muted);border-radius:var(--radius-sm);
  opacity:0;transition:opacity var(--dur) var(--ease),color var(--dur) var(--ease)}
.conv-item:hover .conv-item__menu-btn,.conv-item__menu-btn:focus-visible,.conv-item--active .conv-item__menu-btn{opacity:1}
.conv-item__menu-btn:hover{color:var(--blue-bright)}
@media(hover:none){.conv-item__menu-btn{opacity:1}}
.menu-pop{position:absolute;right:6px;top:calc(100% - 2px);z-index:10;min-width:150px;background:var(--surface);
  border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:5px;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.9),0 0 0 1px rgba(0,140,255,.06);animation:slide-up 160ms var(--ease)}
.menu-pop__item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:8px;
  font-size:13.5px;color:var(--text-2);text-align:left;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.menu-pop__item:hover{background:rgba(0,140,255,.09);color:var(--text)}
.menu-pop__item--danger:hover{background:rgba(0,140,255,.14);color:var(--blue-bright)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;border:1px solid transparent;white-space:nowrap;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease),transform 120ms var(--ease)}
.btn:active{transform:scale(.975)}
.btn--primary{background:var(--blue);color:#00121F;border-color:var(--blue-bright);box-shadow:0 0 20px -6px var(--glow)}
.btn--primary:hover{background:var(--blue-bright);box-shadow:0 0 26px -4px var(--glow-strong)}
.btn--ghost{background:transparent;border-color:var(--border);color:var(--text-2)}
.btn--ghost:hover{border-color:var(--blue);color:var(--blue-bright);background:rgba(0,140,255,.06)}
.btn--danger{background:transparent;border-color:rgba(0,140,255,.4);color:var(--blue-bright)}
.btn--danger:hover{background:rgba(0,140,255,.12)}
.btn--block{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}

/* CHAT */
.chat{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.chat__inner{max-width:880px;margin:0 auto;padding:22px 16px 12px;display:flex;flex-direction:column;
  gap:18px;min-height:100%}

.msg{display:flex;gap:10px;animation:msg-in 260ms var(--ease) both;max-width:100%}
.msg--user{justify-content:flex-end}
.msg--assistant{justify-content:flex-start}
.msg__avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;margin-top:3px;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#7FD4FF,var(--blue) 50%,#00325C 100%);
  box-shadow:0 0 12px -2px var(--glow)}
.msg__avatar::after{content:'';width:6px;height:6px;border-radius:50%;background:#00121F;opacity:.55}
.msg__body{min-width:0;max-width:min(78ch,88%);display:flex;flex-direction:column;gap:5px}
.msg--user .msg__body{align-items:flex-end}
.msg__bubble{padding:11px 15px;border-radius:var(--radius);font-size:15px;line-height:1.6;
  word-break:break-word;overflow-wrap:anywhere;border:1px solid var(--border-soft);background:var(--surface)}
.msg--user .msg__bubble{background:#0B0F14;border-color:rgba(0,140,255,.42);border-bottom-right-radius:5px;
  box-shadow:0 0 0 1px rgba(0,140,255,.05),0 8px 26px -16px var(--glow)}
.msg--assistant .msg__bubble{background:#0C1016;border-bottom-left-radius:5px}
.msg__bubble--error{border-color:rgba(0,140,255,.55);background:rgba(0,140,255,.05);color:var(--text-2);font-size:14px}
.msg__img{display:block;max-width:220px;max-height:220px;border-radius:var(--radius-sm);
  border:1px solid var(--border-soft);margin-bottom:8px}
.msg__meta{font-size:11px;color:var(--text-muted);padding:0 4px;display:flex;align-items:center;gap:10px}
.msg__retry{font-size:11.5px;color:var(--blue-bright);font-weight:600;background:none;border:none;padding:0;
  text-decoration:underline;text-underline-offset:2px}

.text-block{margin:0;white-space:pre-wrap;word-break:break-word}
.text-block + .code-block,.code-block + .text-block,.code-block + .code-block,.text-block + .text-block{margin-top:10px}
.text-block code{background:rgba(0,140,255,.10);border:1px solid rgba(0,140,255,.18);padding:1px 5px;
  border-radius:5px;font-family:var(--font-mono);font-size:.88em;color:#BFE2FF}
.code-block{border:1px solid var(--border-soft);border-radius:var(--radius-sm);background:#07090C;overflow:hidden}
.code-block__head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;
  border-bottom:1px solid var(--border-soft);background:rgba(0,140,255,.04)}
.code-block__lang{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:600}
.code-block__copy{font-size:11.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:5px;padding:3px 8px;
  border-radius:6px;transition:color var(--dur) var(--ease),background var(--dur) var(--ease)}
.code-block__copy:hover{color:var(--blue-bright);background:rgba(0,140,255,.1)}
.code-block pre{margin:0;padding:12px 13px;overflow-x:auto;font-family:var(--font-mono);font-size:13px;
  line-height:1.6;color:#C9E6FF}

.dots{display:inline-flex;align-items:center;gap:4px;padding:4px 2px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--blue-bright);box-shadow:0 0 8px var(--glow);
  animation:dot-bounce 1.3s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.16s}
.dots span:nth-child(3){animation-delay:.32s}
.thinking-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.caret{display:inline-block;width:2px;height:15px;background:var(--blue-bright);margin-left:2px;
  vertical-align:text-bottom;box-shadow:0 0 8px var(--glow);animation:blink 900ms steps(2,start) infinite alternate}

/* EMPTY STATE */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:28px 16px 40px;gap:6px;animation:fade-in 420ms var(--ease)}
.empty__orb{margin-bottom:18px}
.empty__title{font-family:var(--font-display);font-size:clamp(20px,5vw,26px);font-weight:700;
  letter-spacing:-.01em;margin:0;color:var(--text)}
.empty__sub{color:var(--text-2);font-size:14px;margin:6px 0 0;max-width:42ch}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;
  max-width:520px;margin-top:26px}
.suggestion{display:flex;align-items:center;gap:10px;padding:14px;border-radius:var(--radius);background:var(--surface);
  border:1px solid var(--border-soft);color:var(--text-2);font-size:13.5px;font-weight:500;text-align:left;
  transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),transform 140ms var(--ease)}
.suggestion:hover{border-color:rgba(0,140,255,.5);color:var(--text);box-shadow:0 10px 30px -20px var(--glow);transform:translateY(-1px)}
.suggestion svg{color:var(--blue-bright);flex-shrink:0}

/* COMPOSER */
.composer{flex-shrink:0;padding:8px 16px calc(12px + var(--safe-bottom));
  background:linear-gradient(to top,var(--bg) 62%,rgba(5,5,5,0))}
.composer__inner{max-width:880px;margin:0 auto}
.attachments{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px 8px}
.attachment{position:relative;width:66px;height:66px;border-radius:var(--radius-sm);overflow:hidden;
  border:1px solid var(--border);background:var(--surface);animation:slide-up 200ms var(--ease)}
.attachment img{width:100%;height:100%;object-fit:cover;display:block}
.attachment__remove{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;background:rgba(5,5,5,.85);color:var(--blue-bright);
  border:1px solid var(--border);transition:background var(--dur) var(--ease)}
.attachment__remove:hover{background:rgba(0,140,255,.25)}
.composer__box{display:flex;align-items:flex-end;gap:4px;padding:6px 7px 6px 6px;border-radius:var(--radius-xl);
  background:var(--surface);border:1px solid var(--border-soft);
  transition:border-color 200ms var(--ease),box-shadow 200ms var(--ease)}
.composer__box:focus-within{border-color:rgba(0,140,255,.7);
  box-shadow:0 0 0 3px rgba(0,140,255,.09),0 16px 44px -26px var(--glow)}
.composer__input{flex:1;min-width:0;min-height:24px;max-height:180px;resize:none;border:none;outline:none;
  background:transparent;color:var(--text);padding:10px 6px;font-size:15px;line-height:1.5}
.composer__input::placeholder{color:var(--text-muted)}
.composer__hint{font-size:11.5px;color:var(--text-muted);text-align:center;padding:7px 4px 0}
.btn-send{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  border:1px solid rgba(0,140,255,.28);background:rgba(0,140,255,.09);color:var(--blue-bright);
  transition:background var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease),
             border-color var(--dur) var(--ease),transform 120ms var(--ease)}
.btn-send:active{transform:scale(.93)}
.btn-send--active{background:var(--blue);color:#00121F;border-color:var(--blue-bright);box-shadow:0 0 22px -4px var(--glow)}
.btn-send--active:hover{background:var(--blue-bright)}
.btn-send:disabled{opacity:.38}
.btn-stop{background:rgba(0,140,255,.16);color:var(--blue-bright);border-color:rgba(0,140,255,.5)}

/* ORB */
.orb{position:relative;width:var(--orb-size,120px);height:var(--orb-size,120px);display:grid;place-items:center;flex-shrink:0}
.orb__core{position:absolute;inset:20%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#7FD4FF,var(--blue) 46%,#00325C 100%);
  box-shadow:0 0 30px var(--glow),0 0 70px rgba(0,140,255,.25),inset 0 0 24px rgba(0,183,255,.5);
  animation:orb-pulse 3.6s ease-in-out infinite}
.orb__ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(0,140,255,.32)}
.orb__ring--1{border-top-color:var(--blue-bright);border-right-color:transparent;animation:orb-spin 9s linear infinite}
.orb__ring--2{inset:9%;border-bottom-color:var(--blue-bright);border-left-color:transparent;animation:orb-spin-rev 6.5s linear infinite}
.orb__pulse{position:absolute;inset:12%;border-radius:50%;border:1px solid rgba(0,183,255,.5);animation:ring-pulse 2.8s ease-out infinite}
.orb--thinking .orb__core{animation-duration:1.5s}
.orb--listening .orb__core{animation-duration:2.2s}
.orb--speaking .orb__core{animation-duration:1.1s}
.orb--listening .orb__ring--1{animation-duration:4.5s}
.orb--speaking .orb__ring--2{animation-duration:3s}

.visualizer{display:flex;align-items:center;justify-content:center;gap:4px;height:52px}
.visualizer__bar{width:3px;height:100%;border-radius:3px;
  background:linear-gradient(to top,rgba(0,140,255,.35),var(--blue-bright));
  box-shadow:0 0 8px var(--glow);transform-origin:center;animation:wave-bar 1.1s ease-in-out infinite}

/* VOICE */
.voice{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  padding:calc(30px + var(--safe-top)) 24px calc(30px + var(--safe-bottom));animation:fade-in 260ms var(--ease)}
.voice__close{positio

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>ORIX 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--surface:#0F1115;--border:#123A5A;--blue:#008CFF;--blue-b:#00B7FF;--text:#F5F7FA;--text2:#8A94A6;--muted:#566170;--glow:rgba(0,140,255,.35);--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 50% -10%,rgba(0,140,255,.1),transparent 70%);z-index:0}
#root{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(18,58,90,.7);border-radius:4px}
.hdr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;height:60px;padding:0 10px;background:rgba(5,5,5,.86);backdrop-filter:blur(14px);border-bottom:1px solid rgba(18,58,90,.55);flex-shrink:0;z-index:30}
.brand{display:flex;align-items:center;justify-content:center;gap:9px}
.brand svg{width:26px;height:26px;filter:drop-shadow(0 0 8px var(--glow))}
.brand b{font-family:'Space Grotesk',sans-serif;font-size:15px;letter-spacing:.06em;font-weight:700}
.brand b em{font-style:normal;color:var(--blue-b)}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--text2);transition:.22s var(--ease)}
.ib:hover{background:rgba(0,140,255,.08);color:var(--blue-b)}
.ib:active{transform:scale(.94)}
.side{display:flex;gap:4px}.side.r{justify-content:flex-end}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:55;animation:fade .2s var(--ease)}
.sb{position:fixed;top:0;left:0;bottom:0;width:min(330px,88vw);background:#0A0A0A;border-right:1px solid rgba(18,58,90,.55);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .26s var(--ease);z-index:60}
.sb.open{transform:translateX(0)}
.sb-top{padding:16px;border-bottom:1px solid rgba(18,58,90,.55);display:flex;align-items:center;justify-content:space-between}
.sb-new{padding:12px 14px}
.sb-list{flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:3px}
.sb-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;padding:12px 10px 6px}
.sb-bot{border-top:1px solid rgba(18,58,90,.55);padding:8px 10px 12px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:10px;color:var(--text2);font-size:14px;font-weight:500;text-align:left;transition:.22s var(--ease)}
.nav:hover{background:rgba(0,140,255,.07);color:var(--text)}
.nav.acc{background:rgba(0,140,255,.12);color:var(--blue-b);border:1px solid rgba(0,140,255,.28);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid transparent;transition:.22s var(--ease);white-space:nowrap}
.btn:active{transform:scale(.975)}
.btn.pri{background:var(--blue);color:#00121F;border-color:var(--blue-b);box-shadow:0 0 20px -6px var(--glow)}
.btn.pri:hover{background:var(--blue-b)}
.btn.gho{background:transparent;border-color:var(--border);color:var(--text2)}
.btn.gho:hover{border-color:var(--blue);color:var(--blue-b)}
.btn.blk{width:100%}
.chat{flex:1;overflow-y:auto;overscroll-behavior:contain}
.chat-in{max-width:880px;margin:0 auto;padding:22px 16px 12px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.msg{display:flex;gap:10px;animation:msgIn .26s var(--ease)}
.msg.u{justify-content:flex-end}
.msg__av{width:28px;height:28px;border-radius:50%;flex-shrink:0;margin-top:3px;background:radial-gradient(circle at 35% 30%,#7FD4FF,var(--blue) 50%,#00325C);box-shadow:0 0 12px -2px var(--glow)}
.msg__b{min-width:0;max-width:min(78ch,88%);display:flex;flex-direction:column;gap:5px}
.msg.u .msg__b{align-items:flex-end}
.bubble{padding:11px 15px;border-radius:14px;font-size:15px;line-height:1.6;word-break:break-word;border:1px solid rgba(18,58,90,.55);background:var(--surface)}
.msg.u .bubble{background:#0B0F14;border-color:rgba(0,140,255,.42);border-bottom-right-radius:5px;box-shadow:0 8px 26px -16px var(--glow)}
.msg.a .bubble{background:#0C1016;border-bottom-left-radius:5px}
.meta{font-size:11px;color:var(--muted);padding:0 4px}
.bubble pre{margin:8px 0 0;padding:10px;background:#07090C;border:1px solid rgba(18,58,90,.55);border-radius:8px;overflow-x:auto;font-family:ui-monospace,monospace;font-size:13px;color:#C9E6FF}
.dots{display:inline-flex;gap:4px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--blue-b);box-shadow:0 0 8px var(--glow);animation:bounce 1.3s infinite}
.dots span:nth-child(2){animation-delay:.16s}.dots span:nth-child(3){animation-delay:.32s}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 16px;gap:8px}
.empty h2{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:18px 0 0;font-weight:700}
.empty p{color:var(--text2);font-size:14px;margin:6px 0 0;max-width:42ch}
.sugs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:520px;margin-top:26px}
.sug{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid rgba(18,58,90,.55);color:var(--text2);font-size:13.5px;font-weight:500;text-align:left;transition:.22s var(--ease)}
.sug:hover{border-color:rgba(0,140,255,.5);color:var(--text);box-shadow:0 10px 30px -20px var(--glow)}
.comp{flex-shrink:0;padding:8px 16px 12px;background:linear-gradient(to top,var(--bg) 62%,transparent)}
.comp-in{max-width:880px;margin:0 auto}
.att{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px 8px}
.att-i{position:relative;width:66px;height:66px;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.att-i img{width:100%;height:100%;object-fit:cover;display:block}
.att-x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(5,5,5,.85);color:var(--blue-b);border:1px solid var(--border);font-size:14px;line-height:1}
.cbox{display:flex;align-items:flex-end;gap:4px;padding:6px;border-radius:26px;background:var(--surface);border:1px solid rgba(18,58,90,.55);transition:.2s var(--ease)}
.cbox:focus-within{border-color:rgba(0,140,255,.7);box-shadow:0 0 0 3px rgba(0,140,255,.09),0 16px 44px -26px var(--glow)}
.cbox textarea{flex:1;min-height:24px;max-height:180px;resize:none;border:none;outline:none;background:transparent;padding:10px 6px;font-size:15px;line-height:1.5;color:var(--text)}
.cbox textarea::placeholder{color:var(--muted)}
.send{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;border:1px solid rgba(0,140,255,.28);background:rgba(0,140,255,.09);color:var(--blue-b);transition:.22s var(--ease)}
.send.act{background:var(--blue);color:#00121F;border-color:var(--blue-b);box-shadow:0 0 22px -4px var(--glow)}
.send:disabled{opacity:.38}
.hint{font-size:11.5px;color:var(--muted);text-align:center;padding:7px 4px 0}
.orb{position:relative;width:120px;height:120px;display:grid;place-items:center;margin:0 auto}
.orb-c{position:absolute;inset:20%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7FD4FF,var(--blue) 46%,#00325C);box-shadow:0 0 30px var(--glow),inset 0 0 24px rgba(0,183,255,.5);animation:pulse 3.6s ease-in-out infinite}
.orb-r{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(0,140,255,.32)}
.orb-r.r1{border-top-color:var(--blue-b);border-right-color:transparent;animation:spin 9s linear infinite}
.orb-r.r2{inset:9%;border-bottom-color:var(--blue-b);border-left-color:transparent;animation:spinR 6.5s linear infinite}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .5s var(--ease)}
.splash.out{opacity:0;pointer-events:none}
.splash h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(26px,8vw,38px);letter-spacing:.16em;margin:26px 0 0;font-weight:700;text-shadow:0 0 30px var(--glow)}
.splash h1 em{font-style:normal;color:var(--blue-b)}
.splash p{font-size:13px;color:var(--text2);letter-spacing:.08em;margin:0}
.bar{width:180px;height:2px;border-radius:2px;background:rgba(18,58,90,.7);overflow:hidden;margin-top:16px}
.bar span{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--blue-b),transparent);animation:load 1.4s var(--ease) infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@media(min-width:768px){.chat-in{padding:28px 24px 16px}.comp{padding:10px 24px 16px}.sb{width:340px}}
@media(max-width:380px){.sugs{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ===== SCRIPT PART GOES HERE — SEE PART 2 ===== */
</script>
</body>
</html>
